plugins {
    id 'com.android.application'
}

android {
    namespace 'com.papernotes'
    compileSdk 34

    defaultConfig {
        applicationId 'com.papernotes'
        // Kindle Fire HDX (3rd gen) runs Fire OS 3.x, based on Android 4.2.2 (API 17).
        minSdk 17
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }

    signingConfigs {
        // A fixed, non-secret key checked into the repo so every build can be
        // sideloaded over the previous one without uninstalling.
        sideload {
            storeFile file('papernotes.keystore')
            storePassword 'papernotes'
            keyAlias 'papernotes'
            keyPassword 'papernotes'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
