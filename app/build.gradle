plugins {
    id 'com.android.application'
}

android {
    namespace 'com.papernotes'
    compileSdk 34

    defaultConfig {
        applicationId 'com.papernotes'
        // Kindle Fire HDX (3rd gen) runs Fire OS 3.x, based on Android 4.2.2 (API 17).
        minSdk 17
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK can be sideloaded without extra setup.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
